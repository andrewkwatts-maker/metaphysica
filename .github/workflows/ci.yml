name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: pip install --upgrade pip maturin

      - name: Install library with dev deps
        # [dev,sims] restored 2026-08-24: eml-spectral 2.3.0 is now on PyPI
        # with cp311/cp312/cp313 manylinux wheels, so the pin is satisfiable
        # across this matrix at last. Without sims the build step ran 4 of its
        # 35 steps, skipping the simulations it exists to verify.
        run: pip install .[dev,sims]

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Build site (regenerate AutoGenerated/parameters.json)
        run: python -m metaphysica.build --fast --out .

      - name: Run shadow-derivation auditor
        run: |
          python scripts/audit_shadow_derivations.py
          # Exit 1 from the script becomes job failure automatically

      - name: Bayesian PRIORS gating check (Sprint T5 #3)
        run: pytest tests/test_proof_completeness_priors.py -v
