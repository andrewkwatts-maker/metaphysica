name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: pip install --upgrade pip maturin

      - name: Install library with dev deps
        # Deliberately NOT .[dev,sims]. The sims extra pins
        # eml-spectral>=2.0.37, but PyPI serves only 2.0.2 -- the pin is
        # unsatisfiable from the index, which is why CI has never had it and
        # why the build step skips the simulations. Tried it; the install
        # step failed outright. Add sims here once 2.0.37 is published.
        #
        # Until then build.py skips the simulation-dependent steps cleanly
        # rather than hard-failing on their missing inputs, so this stays an
        # incomplete build rather than a broken one.
        run: pip install .[dev]

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Build site (regenerate AutoGenerated/parameters.json)
        run: python -m metaphysica.build --fast --out .

      - name: Run shadow-derivation auditor
        run: |
          python scripts/audit_shadow_derivations.py
          # Exit 1 from the script becomes job failure automatically

      - name: Bayesian PRIORS gating check (Sprint T5 #3)
        run: pytest tests/test_proof_completeness_priors.py -v
