name: Build wheels

# Multi-platform wheel build for the `metaphysica` package.
#
# Matrix:
#   * ubuntu-latest  -> manylinux_2_28_x86_64
#   * windows-latest -> win_amd64
#   * macos-latest   -> macosx_arm64 (Apple Silicon runners)
#   x  python 3.11 / 3.12 / 3.13
#
# Plus a single source distribution and a release job that publishes
# every artifact to PyPI on tag push (v*) or manual dispatch.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wheels.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish artifacts to PyPI after build'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Wheels: 3 OS x 3 Python versions = 9 wheels
  # ---------------------------------------------------------------------------
  wheels:
    name: Wheel ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            maturin-target: x86_64
            manylinux: '2_28'
            artifact-platform: manylinux_2_28_x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            maturin-target: x64
            manylinux: 'auto'
            artifact-platform: win_amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            maturin-target: aarch64
            manylinux: 'auto'
            artifact-platform: macosx_arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build wheel with maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.maturin-target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release
            --strip
            --out target/wheels
            --interpreter python${{ matrix.python-version }}
            --manifest-path rust/physica_core/Cargo.toml

      - name: List built wheels
        shell: bash
        run: ls -la target/wheels/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.artifact-platform }}-cp${{ matrix.python-version }}
          path: target/wheels/*.whl
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Source distribution (sdist) - single tarball
  # ---------------------------------------------------------------------------
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist with maturin
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >-
            --out target/wheels
            --manifest-path rust/physica_core/Cargo.toml

      - name: List built sdist
        run: ls -la target/wheels/

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # PyPI publish is intentionally NOT part of this workflow.
  #
  # PyPI's Trusted Publishing config for this project is registered
  # against `.github/workflows/workflow.yml` (see PyPI project settings ->
  # "Publishing" -> pending publisher). GitHub OIDC embeds the actual
  # workflow filename in the ID token, so a publish attempt from THIS
  # workflow file (`wheels.yml`) fails with `invalid-publisher`.
  #
  # Separation of concerns:
  #   * wheels.yml  (this file) -- builds artifacts on every tag push +
  #                                  uploads them as workflow-run artifacts
  #                                  for CI inspection and manual download.
  #   * workflow.yml            -- runs on `release: published` and does
  #                                  the actual Trusted Publishing exchange
  #                                  with PyPI.
  #
  # To ship a release: after this workflow finishes on a tag push, create a
  # GitHub release on the same tag (`gh release create v<version>`) --
  # workflow.yml will fire and publish to PyPI.
