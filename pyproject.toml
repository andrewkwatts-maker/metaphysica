[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "metaphysica"
version = "2.3.1"
description = "G2-manifold-derived theoretical physics framework: 125 derived constants, quark + constant datasheet API, bundled static-website generator."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Andrew Keith Watts", email = "andrew@principia-metaphysica.org"}
]
maintainers = [
    {name = "Andrew Keith Watts", email = "andrew@principia-metaphysica.org"}
]
keywords = [
    "physics",
    "simulation",
    "G2-manifold",
    "standard-model",
    "cosmology",
    "unified-field-theory",
    "EML",
    "Sheffer-stroke",
    "datasheet",
    "quarks",
    "particle-physics",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "mpmath>=1.3.0",
    "scipy>=1.10.0",
    "sympy>=1.12",
    # 2.3.0 carries the correctness fix to ln() below the normal range
    # (subnormal inputs returned -3.89 instead of -736.83). Published
    # 2026-08-24, so this floor is satisfiable.
    # >=2.4 for ops.abs/sum/max/log10/gt/and_, variadic mul/add, bare-name
    # context resolution and annotated-tail parsing. Expressions in this
    # repo call those operators; against 2.3 they raise AttributeError and
    # every affected parameter is scored as unevaluable.
    "eml-math>=2.4.0",
]

[project.optional-dependencies]
# Heavy / build-only deps live behind extras so plain `pip install metaphysica`
# stays slim â€” the bundled Get() datasheet fast path needs none of these.
# The full website builder should use `pip install metaphysica[full]`.
# arithma backs the ARITHMA track of the triple-track guard. It is an EXTRA,
# not a hard dependency, and deliberately so: every call site is written to
# degrade when the backend is absent, and declaring it as required made CI
# install a build whose compiled extension does not load. That stub imports
# cleanly and binds Expression to None, which `except ImportError` cannot
# see, so a graceful degradation became an import crash that took four test
# modules and the whole simulations package with it.
#
# The upper bound is measured, not cautious: an unreleased 2.0.4 is a
# FIXED-POINT rewrite whose usable range is about [1e-15, 9.2e18], while this
# framework spans 1.9e-93 to 4.8e34. See tests/test_arithma_dynamic_range.py.
sims  = ["eml-spectral>=2.3.0", "arithma>=2.0.1,<2.0.3"]   # advanced algebra (E8 / Leech / Octonion / Clifford) for the sim engine
pdf   = ["xhtml2pdf>=0.2.16"]      # PDF paper export
plots = ["matplotlib>=3.7.0", "pandas>=2.0.0"]   # plot regeneration
full = [
    "eml-spectral>=2.3.0",
    "arithma>=2.0.1,<2.0.3",
    "xhtml2pdf>=0.2.16",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    # CI installs .[dev] and gates on tests/test_proof_completeness_priors.py,
    # which builds the ledger DataFrame. Without pandas that gate errors out
    # instead of gating, so the test dependency belongs here.
    "pandas>=2.0.0"]
# Optional Rust acceleration. The pure-Python install path above is the
# default; the Rust core (under `rust/physica_core/`) is opt-in and built
# via maturin. Either:
#
#     pip install metaphysica[rust]
#
# (which pulls in maturin and lets the build system pick up
# `[tool.maturin]` below) or, for active development:
#
#     pip install maturin
#     maturin develop --features extension-module
#
# The Rust core mirrors the Python public API behind `_HAS_RUST`. When the
# extension is unbuilt the package still imports and the pure-Python path
# runs, but the fallback is NOT silent: `metaphysica.assert_rust_backend()`
# raises, and `metaphysica.backend_report()` says exactly what is missing.
rust = ["maturin>=1.7,<2.0"]

[project.urls]
Homepage = "https://principia-metaphysica.org"
Repository = "https://github.com/andrewkwatts-maker/metaphysica"
Issues = "https://github.com/andrewkwatts-maker/metaphysica/issues"
"Static-site host" = "https://github.com/andrewkwatts-maker/PrincipiaMetaphysica"

[project.scripts]
metaphysica-build      = "metaphysica.build:main"
metaphysica-datasheets = "metaphysica.generators.generate_datasheets:main"
metaphysica-app        = "metaphysica._launcher:launch"
# v2.2.0 — unified CLI (subcommands: get / list / help / build)
metaphysica            = "metaphysica._help:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]

# â”€â”€ Optional Rust acceleration (maturin) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Configuration is loaded only when maturin is the active build backend
# (`pip install metaphysica[rust]` or
# `maturin develop --features extension-module`).
# maturin IS the declared build backend, so this block is always active for
# `pip install .` -- the wheel always carries the Rust extension.
[tool.maturin]
manifest-path = "rust/physica_core/Cargo.toml"
module-name = "metaphysica._physica_core"
# Wheel builds turn on `extension-module` (which implies `python`).
# Plain `python` is the testable variant that still links libpython;
# see rust/physica_core/Cargo.toml for why the two are separate.
features = ["extension-module"]
python-source = "src"
strip = true
# Force-include the bundled website/AutoGenerated/ subtree even though
# AutoGenerated/ is gitignored at the repo root (the gitignore protects
# the build-time output dir, NOT the curated assets that ship with the
# wheel). Without this glob the wheel's website/AutoGenerated/ is empty.
include = [
    { path = "src/metaphysica/website/AutoGenerated/**/*", format = ["sdist", "wheel"] },
]


