[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaphysica"
version = "1.3.0"
description = "G2-manifold-derived theoretical physics framework: 125 derived constants, quark + constant datasheet API, bundled static-website generator."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Andrew Keith Watts", email = "andrew@principia-metaphysica.org"}
]
maintainers = [
    {name = "Andrew Keith Watts", email = "andrew@principia-metaphysica.org"}
]
keywords = [
    "physics",
    "simulation",
    "G2-manifold",
    "standard-model",
    "cosmology",
    "unified-field-theory",
    "EML",
    "Sheffer-stroke",
    "datasheet",
    "quarks",
    "particle-physics",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "mpmath>=1.3.0",
    "scipy>=1.10.0",
    "sympy>=1.12",
    "eml-math>=1.3.0",
]

[project.optional-dependencies]
# Heavy / build-only deps live behind extras so plain `pip install metaphysica`
# stays slim — the bundled Get() datasheet fast path needs none of these.
# The full website builder should use `pip install metaphysica[full]`.
sims  = ["eml-spectral>=1.3.0"]   # advanced algebra (E8 / Leech / Octonion / Clifford) for the sim engine
pdf   = ["xhtml2pdf>=0.2.16"]      # PDF paper export
plots = ["matplotlib>=3.7.0", "pandas>=2.0.0"]   # plot regeneration
full = [
    "eml-spectral>=1.3.0",
    "xhtml2pdf>=0.2.16",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://principia-metaphysica.org"
Repository = "https://github.com/andrewkwatts-maker/metaphysica"
Issues = "https://github.com/andrewkwatts-maker/metaphysica/issues"
"Static-site host" = "https://github.com/andrewkwatts-maker/PrincipiaMetaphysica"

[project.scripts]
# Full website rebuild: runs sims + every generator + copies bundled site assets
metaphysica-build = "metaphysica.build:main"
# Regenerate the bundled quark + constant datasheets shipped in the wheel
metaphysica-datasheets = "metaphysica.generators.generate_datasheets:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship every JSON / MD / HTML / CSS / JS / SVG / PNG bundled with the package
# so generators can find their data files and the website can be reconstituted
# anywhere via metaphysica-build --out PATH.
"metaphysica" = [
    "**/*.json",
    "**/*.md",
    "**/*.html",
    "**/*.css",
    "**/*.js",
    "**/*.svg",
    "**/*.png",
    "**/*.txt",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]
