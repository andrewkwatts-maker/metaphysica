[package]
name = "physica_core"
version = "2.3.1"
edition = "2021"
description = "G2-manifold-derived theoretical-physics core: 125 derived constants, quark predictions, CKM, gates, simulations."
license = "Apache-2.0"
authors = ["Andrew Keith Watts <andrew@principia-metaphysica.org>"]
repository = "https://github.com/andrewkwatts-maker/metaphysica"

[lib]
name = "physica_core"
crate-type = ["cdylib", "lib"]

[features]
default = []
# `python` builds the PyO3 bindings against a normal libpython, so
# `cargo test --features python` can link and every #[cfg(test)] block in
# `pyfacade` actually runs. `extension-module` is the wheel-only superset:
# it adds pyo3/extension-module, which deliberately drops the libpython
# link and therefore cannot be tested. Collapsing these into one feature
# silently deletes the bindings' test coverage.
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
parking_lot = "0.12"
thiserror = "1.0"
pyo3 = { version = "0.22", optional = true }

# NOTE: [profile.release] intentionally omitted â€” when this crate is built
# inside the engine workspace it inherits the workspace-level profile;
# defining one here only triggers a "profiles for the non root package
# will be ignored" warning. Standalone-build profiles can be added at the
# metaphysica root Cargo.toml workspace level if needed.
